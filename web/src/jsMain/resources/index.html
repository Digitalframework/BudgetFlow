<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banking App - KontoAnalyse</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0d0d1a;
            color: #dddddd;
            min-height: 100vh;
            overflow: hidden;
        }
        
        #root {
            width: 100%;
            height: 100vh;
        }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: #1a1a2e;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #333333;
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #444444;
        }
        
        /* Ant Design dark theme overrides */
        .ant-layout-sider-trigger {
            background: #1a1a2e !important;
        }
        
        .ant-table-wrapper .ant-table {
            background: #111127 !important;
            color: #ddd !important;
        }
        
        .ant-table-wrapper .ant-table-thead > tr > th {
            background: #1a1a2e !important;
            color: #888 !important;
            border-bottom: 1px solid #333 !important;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        .ant-table-wrapper .ant-table-tbody > tr > td {
            border-bottom: 1px solid #1a1a2e !important;
        }
        
        .ant-table-wrapper .ant-table-tbody > tr:hover > td {
            background: #1a1a2e !important;
        }
        
        .ant-card {
            background: #111127 !important;
            border-color: #222 !important;
        }
        
        .ant-card .ant-card-head {
            background: #111127 !important;
            border-color: #222 !important;
            color: #ddd !important;
        }
        
        .ant-statistic-title {
            color: #888 !important;
        }
        
        .ant-segmented {
            background: #1a1a2e !important;
        }
        
        .ant-segmented-item-selected {
            background: #1677ff !important;
            color: #fff !important;
        }
        
        .ant-upload-drag {
            background: transparent !important;
        }
        
        .ant-select-selector {
            background: #1a1a2e !important;
            border-color: #333 !important;
            color: #ddd !important;
        }
        
        .ant-select-dropdown {
            background: #1a1a2e !important;
        }
        
        .ant-select-item {
            color: #ddd !important;
        }
        
        .ant-select-item:hover,
        .ant-select-item-option-selected {
            background: #262640 !important;
        }
        
        .ant-modal-content {
            background: #1a1a2e !important;
        }
        
        .ant-modal-header {
            background: #1a1a2e !important;
        }
        
        .ant-modal-title {
            color: #fff !important;
        }
        
        .ant-modal-body {
            color: #ddd !important;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script src="web.js"></script>
</body>
</html>
